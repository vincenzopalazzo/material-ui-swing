buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "gradle.plugin.com.github.sherter.google-java-format:google-java-format-gradle-plugin:0.9"
    }
}

apply plugin: 'java-library'
apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: "com.github.sherter.google-java-format"

googleJavaFormat {
    toolVersion = '1.15.0'
}

apply from: 'gradle/local-deploy.gradle'
apply from: 'gradle/release.gradle'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.swinglabs:swingx:1.6.1'
    implementation 'com.github.jiconfont:jiconfont-swing:1.0.1'

    //Slf4j configuration
    testImplementation 'ch.qos.logback:logback-classic:1.2.3'
    testImplementation 'ch.qos.logback:logback-core:1.2.3'
    testImplementation 'org.slf4j:slf4j-api:1.7.25'
    // Use JUnit test framework
    testImplementation 'junit:junit:4.12'
    testImplementation group: 'org.assertj', name: 'assertj-swing-junit', version: '3.9.2'
    // Testing dependencies
    testImplementation 'io.github.material-ui-swing:DarkStackOverflowTheme:0.0.1-rc2'
    testImplementation group: 'com.toedter', name: 'jcalendar', version: '1.4'
}

allprojects {
  apply plugin: 'java'

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:deprecation,unchecked"
        }
    }
    sourceCompatibility = "${JDK_VERSION}"
    targetCompatibility = "${JDK_VERSION}"
}

jar {
    archiveVersion.set(VERSION as String)

	inputs.property("moduleName", MODULE_NAME)

	manifest {
		attributes 'Automatic-Module-Name': MODULE_NAME
	}
}

task jarWithDependencies(type: Jar) {
    archiveVersion.set(VERSION as String)
    archiveClassifier.set('with-dependencies')
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

task runDemo(type: Exec) {
    group = "material-ui-swing"
    description = "Run the Material-UI-Swing demo"
    commandLine "java", "-classpath", sourceSets.test.runtimeClasspath.getAsPath(), 'integration.gui.mock.DemoGUITest'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}
